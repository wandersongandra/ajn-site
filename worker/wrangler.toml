name = "ajn-carreiras-api"
main = "index.ts"
compatibility_date = "2026-11-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://ajnengenharia.com.br"
CORS_ORIGINS = "https://ajnengenharia.com.br,https://www.ajnengenharia.com.br,https://carreiras.ajnengenharia.com.br"
APP_URL = "https://carreiras.ajnengenharia.com.br"
TURNSTILE_SITE_KEY = "0x4AAAAAAAx_PROD_SITE_KEY_x"

# Banco de dados Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "prod-ajn-carreiras-d1"
database_id = "00000000-0000-0000-0000-000000000000" # Substituir com o ID gerado pelo wrangler d1 create
migrations_dir = "db/migrations"

# Bucket Cloudflare R2 Privado para Armazenamento de Currículos
[[r2_buckets]]
binding = "RESUMES_BUCKET"
bucket_name = "prod-ajn-carreiras-resumes"
preview_bucket_name = "prod-ajn-carreiras-resumes-preview"

# KV para Rate Limiting distribuído (prod-ajn-carreiras-kv)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "00000000000000000000000000000000"

# Durable Object para Rate Limiting atômico fortemente consistente na borda
[durable_objects]
bindings = [
  { name = "RATE_LIMITER_DO", class_name = "RateLimiterDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

[env.staging]
vars = { ENVIRONMENT = "staging", CORS_ORIGIN = "https://staging-ajn-carreiras-api.workers.dev", CORS_ORIGINS = "https://staging-ajn-carreiras-api.workers.dev", APP_URL = "https://staging-ajn-carreiras-api.workers.dev", TURNSTILE_SITE_KEY = "0x4AAAAAAAx_STAGING_SITE_KEY_x" }
[env.staging.durable_objects]
bindings = [
  { name = "RATE_LIMITER_DO", class_name = "RateLimiterDO" }
]
[[env.staging.d1_databases]]
binding = "DB"
database_name = "staging-ajn-carreiras-d1"
database_id = "staging-0000-0000-0000-000000000000"
migrations_dir = "db/migrations"
[[env.staging.r2_buckets]]
binding = "RESUMES_BUCKET"
bucket_name = "staging-ajn-carreiras-resumes"
[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "staging-0000000000000000000000000"
