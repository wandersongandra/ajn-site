name: One-time import of AJN Instagram covers

on:
  push:
    branches:
      - feat/projetos-eletricos-spda-cabeamento-social-20261009
    paths:
      - .github/workflows/import-ajn-instagram-covers.yml

permissions:
  contents: write

jobs:
  import-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Install image conversion tools
        run: python3 -m pip install --user Pillow==11.3.0

      - name: Download verified public post covers
        run: python3 scripts/download-social-covers.py

      - name: Commit local WebP files back to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/social/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets(social): import original AJN Instagram post covers"
          git push origin HEAD:feat/projetos-eletricos-spda-cabeamento-social-20261009
