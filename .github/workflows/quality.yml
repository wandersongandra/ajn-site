name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_ORIGIN: https://sienna-mongoose-223157.hostingersite.com
      PUBLIC_ALLOW_INDEXING: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Static build
        run: npm run build

      - name: SEO and link audit
        run: npm run audit:seo

      - name: Institutional content and canonical audit
        run: npm run audit:editorial

      - name: SST landing pages and Blog service link audit
        run: npm run audit:sst-seo

      - name: Services catalog image weight and search behavior
        run: npm run audit:services-catalog

      - name: Dead CSS and active sections regression audit
        run: npm run audit:dead-css

      - name: Duplicate asset inventory (non-destructive)
        run: npm run audit:assets

      - name: Internal anchor audit
        run: npm run audit:fragments

      - name: Environment indexing and canonical audit
        run: npm run audit:deploy

      - name: Security baseline audit
        run: npm run audit:security

      - name: Content link scheme regression test
        run: npm run test:security-links

      - name: Audit regression fixtures
        run: npm run test:audits

      - name: Contact delivery fallback audit
        run: npm run audit:contact

      - name: Blog content and image audit
        run: node scripts/audit-blog.mjs

      - name: Header navigation audit
        run: node scripts/audit-header.mjs

      - name: Home conversion and structure audit
        run: node scripts/audit-home.mjs

      - name: Home sectors design and accessibility audit
        run: npm run audit:sectors

      - name: Home workflow typography and motion audit
        run: npm run audit:workflow

      - name: Home hero typography, copy and accessibility audit
        run: npm run audit:hero

      - name: Home services design and accessibility audit
        run: npm run audit:home-services

      - name: Footer content and responsive design audit
        run: npm run audit:footer

      - name: About page design, images and accessibility audit
        run: npm run audit:about

      - name: Sitemap consolidation and redirect audit
        run: npm run audit:sitemap

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Valida separadamente a build pública: não publicar prévia com noindex.
      - name: Production SEO indexing smoke test
        env:
          PUBLIC_SITE_ORIGIN: https://ajnengenharia.com.br
          PUBLIC_ALLOW_INDEXING: 'true'
        run: |
          npm run build
          npm run audit:deploy
          npm run audit:seo
