name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_ORIGIN: https://sienna-mongoose-223157.hostingersite.com
      PUBLIC_ALLOW_INDEXING: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Static build
        run: npm run build

      - name: SEO and link audit
        run: npm run audit:seo

      - name: Blog content and image audit
        run: node scripts/audit-blog.mjs

      - name: Header navigation audit
        run: node scripts/audit-header.mjs

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
