name: Dependency Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-security:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all installed dependencies
        run: npm audit --audit-level=high
      # GitHub's Dependency Graph is currently disabled for this repository.
      # After enabling it, set repository variable ENABLE_DEPENDENCY_REVIEW=true.
      - name: Native GitHub dependency review (when graph enabled)
        if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
