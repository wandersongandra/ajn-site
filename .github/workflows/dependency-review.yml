name: Dependency Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-security:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all installed dependencies
        run: npm audit --audit-level=high
      # GitHub's Dependency Graph is currently disabled for this repository.
      # After enabling it, set repository variable ENABLE_DEPENDENCY_REVIEW=true.
      - name: Native GitHub dependency review (when graph enabled)
        if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
