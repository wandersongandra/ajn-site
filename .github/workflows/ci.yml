name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: ajn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_ORIGIN: https://sienna-mongoose-223157.hostingersite.com
      PUBLIC_ALLOW_INDEXING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
