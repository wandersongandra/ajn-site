name: Live Security Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Verify published headers, canonical URLs and redirects (GET only)
        run: node scripts/audit-live-security.mjs
